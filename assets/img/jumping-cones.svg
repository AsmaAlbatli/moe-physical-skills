<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">طفل يقفز فوق الأقماع في الصالة الرياضية</title>
  <desc id="d">رسم توضيحي لطفل بقميص بنفسجي يقفز فوق ثلاثة أقماع تدريب داخل صالة رياضية مضيئة.</desc>
  <defs>
