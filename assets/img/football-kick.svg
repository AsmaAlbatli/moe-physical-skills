<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">طفل يركل كرة القدم نحو المرمى</title>
  <desc id="d">رسم توضيحي ملون لطفل يلبس قميصًا أخضر ويركل كرة قدم باتجاه مرمى على ملعب عشبي.</desc>
  <defs>
