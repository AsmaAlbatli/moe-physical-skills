<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">طفل يتنطط بالكرة في ملعب كرة السلة</title>
  <desc id="d">رسم توضيحي لطفل بقميص برتقالي ينطط كرة السلة بيده داخل ملعب خشبي مع خطوط ملعب.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4fbff"/><stop offset="1" stop-color="#fff4dd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c17a"/><stop offset="1" stop-color="#d38f47"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9d3f"/><stop offset="1" stop-color="#df5a16"/>
    </linearGradient>
    <radialGradient id="b" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffb46e"/><stop offset="1" stop-color="#dd5c17"/>
    </radialGradient>
    <filter id="f" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#72350f" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="36" fill="url(#bg)"/>

