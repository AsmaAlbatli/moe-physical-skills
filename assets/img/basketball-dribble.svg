    <path d="M210 326l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" opacity=".9"/>
  </g>
  <g fill="#ffffff" opacity=".8">
    <circle cx="564" cy="234" r="6"/><circle cx="622" cy="268" r="4"/><circle cx="250" cy="220" r="5"/>
