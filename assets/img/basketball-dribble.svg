  <path d="M407 416c12 27 14 51 9 71" fill="none" stroke="#f7c698" stroke-width="31" stroke-linecap="round"/>
  <path d="M415 481c0 13 6 23 16 30" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <path d="M427 502c12 3 21 10 24 20 0 9-8 15-18 12l-28-8c-8-3-8-11-4-17Z" fill="#ffce4a"/>

