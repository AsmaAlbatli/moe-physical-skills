  <path d="M0 404h800v196H0Z" fill="url(#court)"/>
  <g stroke="#b97734" stroke-width="4" opacity=".55">
    <path d="M0 448h800M0 496h800M0 544h800M0 590h800"/>
  </g>
  <path d="M0 404h800v14H0Z" fill="#ffffff" opacity=".55"/>
