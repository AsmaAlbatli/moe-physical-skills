  <path d="M288 488c-5 13-3 24 4 33" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <path d="M272 515c12-3 28 0 40 8 5 10-2 18-14 20l-31 2c-9-1-13-9-11-17Z" fill="#ff7a3d"/>

