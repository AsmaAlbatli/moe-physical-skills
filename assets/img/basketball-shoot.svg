  <path d="M290 232c0-30 19-49 47-49 29 0 47 19 47 47 0 30-19 49-47 49-29 0-47-19-47-47Z" fill="#f5c495"/>
  <path d="M286 226c-2-31 17-52 49-53 28-1 47 17 51 43-13-1-28-7-41-22-7 14-27 28-59 32Z" fill="#3a2932"/>
  <path d="M369 194c19-12 35-1 30 18-3 10-10 17-18 20 4-14 0-27-12-38Z" fill="#3a2932"/>
  <circle cx="341" cy="232" r="5" fill="#25313d"/>
  <path d="M350 254c8 6 17 5 24-1" fill="none" stroke="#b46b4b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="367" cy="245" r="7" fill="#ee9d83" opacity=".4"/>
  <path d="M291 240c-9 0-13 8-10 15 2 6 8 9 13 8" fill="#f5c495"/>

