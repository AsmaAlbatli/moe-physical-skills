<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">طفلة تصوب كرة السلة نحو السلة</title>
  <desc id="d">رسم توضيحي لطفلة بقميص برتقالي ترفع كرة سلة وتصوبها نحو سلة معلقة في صالة رياضية بأرضية خشبية.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff9ff"/><stop offset="1" stop-color="#fff2d9"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4bb70"/><stop offset="1" stop-color="#cf8b43"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f43"/><stop offset="1" stop-color="#e5651d"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#e2611a"/>
    </radialGradient>
    <filter id="bs" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c3a10" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="36" fill="url(#wall)"/>
  <circle cx="100" cy="92" r="48" fill="#ffe17d" opacity=".85"/>
  <circle cx="100" cy="92" r="70" fill="#ffe17d" opacity=".14"/>

  <!-- نوافذ علوية -->
  <g opacity=".55">
    <rect x="66" y="190" width="120" height="90" rx="14" fill="#bdefff"/>
    <rect x="202" y="190" width="90" height="90" rx="14" fill="#bdefff"/>
    <path d="M126 190v90M66 235h120M247 190v90M202 235h90" stroke="#ffffff" stroke-width="7"/>
  </g>

  <!-- لافتة -->
  <g filter="url(#bs)">
    <rect x="342" y="88" width="222" height="62" rx="18" fill="#0f8f7a"/>
    <circle cx="372" cy="119" r="14" fill="#ffe17d"/>
    <path d="M366 119l4 5 7-10" stroke="#0f8f7a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M400 106h136M400 122h104M400 138h82" stroke="#b8f5e5" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- اللوحة والسلة -->
  <g filter="url(#bs)">
