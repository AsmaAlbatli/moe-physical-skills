  <path d="M312 294c-14-28-13-55 4-78" fill="none" stroke="#eab183" stroke-width="22" stroke-linecap="round"/>
  <circle cx="322" cy="208" r="12" fill="#eab183"/>
  <path d="M376 294c16-27 22-54 16-79" fill="none" stroke="#f5c495" stroke-width="22" stroke-linecap="round"/>
  <circle cx="394" cy="207" r="12" fill="#f5c495"/>

  <!-- الكرة -->
  <g filter="url(#bs)">
    <circle cx="458" cy="190" r="44" fill="url(#ball)"/>
    <g stroke="#7a2e0c" stroke-width="4" fill="none" opacity=".85">
