      <path d="M431 158c14 8 40 8 54 0M431 222c14-8 40-8 54 0"/>
    </g>
  </g>
  <path d="M390 166c-16 2-34 2-50 0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 12" opacity=".8"/>
  <path d="M500 226c20-18 40-30 62-36" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 13" opacity=".8"/>

  <!-- أقماع جانبية -->
  <g opacity=".8">
    <path d="M688 470l26 0 10 54h-46Z" fill="#0f8f7a"/>
    <rect x="672" y="520" width="58" height="12" rx="6" fill="#0b6d5e"/>
  </g>

  <g fill="#ffe17d">
    <path d="M566 322l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
    <path d="M236 344l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" opacity=".9"/>
  </g>
</svg>
