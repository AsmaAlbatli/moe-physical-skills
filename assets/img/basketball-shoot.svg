    <rect x="632" y="160" width="76" height="54" rx="5" fill="none" stroke="#ff7a3d" stroke-width="7"/>
    <path d="M570 236h160" stroke="#263645" stroke-width="7" stroke-linecap="round"/>
    <path d="M612 238h76l-10 58h-56Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <g stroke="#ffffff" stroke-width="2.5" opacity=".85">
      <path d="M620 242l10 50M638 240l6 53M656 240l2 54M674 241l-4 53M626 258h52M632 278h42"/>
    </g>
    <circle cx="650" cy="237" r="10" fill="#ff7a3d"/>
