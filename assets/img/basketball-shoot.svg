  <path d="M306 285c12 8 26 11 41 9 15-2 28-8 38-17" fill="none" stroke="#ffe0bf" stroke-width="5" opacity=".9"/>
  <text x="344" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">11</text>

  <!-- شورت -->
  <path d="M303 370c22 9 52 9 74 0l7 41c-12 12-26 17-42 17-17 0-31-5-44-17Z" fill="#ffffff"/>
  <path d="M339 386v41" stroke="#d8e5ec" stroke-width="4"/>

